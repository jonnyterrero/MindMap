name: ML summary batch (daily)

# Runs the Python Tier-0 clinician-summary batch on a schedule and upserts
# mindmap_ml_summaries (the app only reads them). The batch is Python, so this
# is a GitHub Action — NOT a Vercel cron (those only hit Node routes).
#
# The project URL is public and hardcoded below. Do not store it as a secret
# (pasting a key into MINDMAP_SUPABASE_URL caused Invalid URL failures).
#
# Required repository secret:
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase Secret API key (sb_secret_...),
#                                NOT a legacy JWT (eyJ...), NOT a publishable key
# Idempotent (upsert on user_id+period_end+model_version) and re-runnable.

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ml-summary-batch
  cancel-in-progress: false

jobs:
  summary:
    name: Build & upsert clinician summaries
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zunpccwjghwpiljwwjpv.supabase.co
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: guard
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          KEY="$(printf '%s' "${KEY:-}" | tr -d '\r\n[:space:]')"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set — skipping (inert until configured)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$KEY" in
            eyJ*)
              echo "::error::SUPABASE_SERVICE_ROLE_KEY is a legacy JWT (starts with eyJ). Those keys are disabled on this project. In GitHub → Settings → Secrets → Actions, Update SUPABASE_SERVICE_ROLE_KEY with a Secret API key from Supabase → Project Settings → API Keys (it starts with sb_secret_)."
              exit 1
              ;;
            sb_publishable*)
              echo "::error::SUPABASE_SERVICE_ROLE_KEY is a publishable/anon key. GitHub Actions needs a Secret key (sb_secret_)."
              exit 1
              ;;
            http://*|https://*)
              echo "::error::SUPABASE_SERVICE_ROLE_KEY looks like a URL. Paste the secret key, not the project URL. The URL is already hardcoded in this workflow."
              exit 1
              ;;
            sb_secret*)
              echo "key_kind=sb_secret" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Key does not start with sb_secret_. If the job fails with Unregistered API key, replace it with a new Secret API key from the Supabase dashboard."
              echo "key_kind=other" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run summary batch
        if: steps.guard.outputs.run == 'true'
        working-directory: ml
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\r\n[:space:]')"
          uv sync
          uv pip install supabase
          uv run python -m mindmap_ml.serving.summary_batch
