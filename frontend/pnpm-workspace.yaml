packages:
  - .

# Temporary security pins for transitive dependencies. Remove these once
# Recharts and Sentry resolve the patched versions directly.
overrides:
  brace-expansion: 5.0.9
  lodash: 4.18.1

allowBuilds:
# sentry-cli binary is only used for source-map upload, which we don't do
  '@sentry/cli': false
  core-js: false
  sharp: true
